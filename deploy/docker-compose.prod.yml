services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    container_name: travelcrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelcrm}
      POSTGRES_USER: ${POSTGRES_USER:-travelcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: travelcrm_backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-travelcrm}
      DB_USER: ${POSTGRES_USER:-travelcrm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://usar.1edu.kz}
      APP_UPLOAD_DIR: /app/uploads
    depends_on:
      - postgres
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://usar.1edu.kz/api}
    container_name: travelcrm_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://usar.1edu.kz/api}
    depends_on:
      - backend

  caddy:
    image: mirror.gcr.io/library/caddy:2.8-alpine
    container_name: travelcrm_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config: